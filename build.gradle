plugins {
    id 'java'
}

group = 'com.gillodaby'
version = '5.0.0'

tasks.named('jar') {
    archiveBaseName.set('BetterKits')
}

// Ensure plugin.json and manifest.json are included at the root of the plugin JAR
// (manifest.json optional)
tasks.named('jar') {
    if (file('plugin.json').exists()) {
        from('plugin.json') { into '' }
    }
    if (file('manifest.json').exists()) {
        from('manifest.json') { into '' }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

repositories {
    mavenCentral()
}

configurations {
    includeInJar
}

dependencies {
    // Use compileOnly for server API (adjust path if your HytaleServer.jar is located elsewhere)
    compileOnly files("../libs/HytaleServer.jar")

    // (no external JSON dependency)
}

tasks.named('jar') {
    from {
        configurations.includeInJar.collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
}


